name: 睡醒消息

# ⚠️ 时区很关键：GitHub Actions 的 cron 用 UTC
#    北京时间 08:00 = UTC 00:00
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许在网页上手动点「Run workflow」测试

permissions:
  contents: write # 允许把历史记录提交回仓库（用于去重）

concurrency:
  group: daily-question
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily.py

      - name: 记录历史（用于去重）
        # always() = 即使上一步推送失败，也把已完成的部分（比如刚写完的理解）提交回仓库，
        # 避免下次重复推送同一条
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 记录 $(date -u +%F) 的问题"
          # 远程可能被网页编辑改过 → 先 rebase 再推，避免 non-fast-forward
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"
