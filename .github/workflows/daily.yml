name: 每日一问

# ⚠️ 时区很关键：GitHub Actions 的 cron 用 UTC
#    北京时间 08:00 = UTC 00:00
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在网页上手动点「Run workflow」测试

permissions:
  contents: write # 允许把历史记录提交回仓库（用于去重）

concurrency:
  group: daily-question
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily.py

      - name: 记录历史（用于下次去重）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 记录 $(date -u +%F) 的问题"
            git push
          fi
